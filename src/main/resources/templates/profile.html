<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${summoner.name} + ' - Profil'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { background-color: #2b3035; color: white; border: 1px solid #444; }
        .progress { height: 25px; background-color: #444;}
    </style>
</head>
<body class="bg-dark text-light">
<div class="container mt-5">
    <a href="/" class="btn btn-outline-secondary mb-3">← Zpět na vyhledávání</a>

    <div class="row">
        <div class="col-md-4 text-center">
            <div class="card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="position-relative mb-3">
                        <img th:src="'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/profileicon/' + ${summoner.iconId} + '.png'"
                             class="rounded-circle border border-3 border-primary shadow"
                             width="100" height="100"
                             alt="Profilovka">
                    </div>

                    <h2 th:text="${summoner.name}">Jméno</h2>
                    <p class="text-secondary mb-2">Level <span th:text="${summoner.summonerLevel}">0</span></p>

                    <form th:action="@{/watchlist/add}" method="post" class="mb-3">
                        <input type="hidden" name="summonerId" th:value="${summoner.id}">
                        <button type="submit" class="btn btn-warning btn-sm fw-bold w-100">⭐ Sledovat hráče</button>
                    </form>

                    <hr>
                    <h5>Tagy:</h5>
                    <div class="mt-2 mb-3">
                        <span th:each="tag : ${tags}"
                              class="badge rounded-pill bg-info text-dark m-1"
                              th:text="${tag.name}">Tag</span>
                    </div>
                </div>

                <div class="mt-auto pt-3 border-top text-start">
                    <h6 class="text-primary fw-bold">Moje poznámka k hráči:</h6>
                    <form th:action="@{/notes/save}" method="post">
                        <input type="hidden" name="summonerId" th:value="${summoner.id}">
                        <textarea name="text" class="form-control bg-dark text-white border-secondary mb-2 small" rows="3"
                                  placeholder="Např. Dobrý support, ale často tiltuje..." th:text="${note}"></textarea>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Uložit poznámku</button>
                    </form>
                </div>
            </div>
        </div>x

        <div class="col-md-8">
            <div class="card p-4 h-100">
                <h3>Analýza výkonu</h3>
                <hr>

                <div class="mb-3">
                    <label>Consistency Score (KDA)</label>
                    <div class="progress">
                        <div class="progress-bar bg-success" role="progressbar"
                             th:style="'width: ' + ${report.consistencyScore} + '%'"
                             th:text="${report.consistencyScore} + '/100'"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Farming Efficiency</label>
                    <div class="progress">
                        <div class="progress-bar bg-warning text-dark" role="progressbar"
                             th:style="'width: ' + ${report.farmingEfficiency} + '%'"
                             th:text="${report.farmingEfficiency} + '/100'"></div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-6 text-center border-end">
                        <h4 th:text="${report.winRate} + '%'">0%</h4>
                        <small class="text-secondary">Winrate</small>
                    </div>
                    <div class="col-6 text-center">
                        <h4 th:text="${report.killParticipation} + '%'">0%</h4>
                        <small class="text-secondary">Kill Participation</small>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-6 text-center border-end">
                        <h4 th:text="${report.avgDamage}">0</h4>
                        <small class="text-secondary">Průměrný Damage</small>
                    </div>
                    <div class="col-6 text-center">
                        <h4 th:text="${report.visionScore}">0</h4>
                        <small class="text-secondary">Vision Score</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card p-4">
                <h3 class="mb-4">Poslední zápasy</h3>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Result</th>
                            <th>Champion</th>
                            <th>Mode</th>
                            <th>KDA</th>
                            <th>CS</th>
                            <th>Vision</th>
                            <th>Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="game : ${recentGames}"
                            th:classappend="${game.win} ? 'border-start border-4 border-success' : 'border-start border-4 border-danger'">

                            <td th:text="${game.win ? 'WIN' : 'LOSS'}"
                                th:class="${game.win ? 'text-success fw-bold' : 'text-danger fw-bold'}"></td>

                            <td>
                                <img th:src="'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/' + ${game.champion.name} + '.png'"
                                     width="40" class="rounded-circle me-2"
                                     onerror="this.src='https://via.placeholder.com/40?text=?'">
                                <span th:text="${game.champion.name}">ID</span>
                            </td>

                            <td th:text="${game.match.gameMode}" class="small text-secondary"></td>

                            <td th:text="${game.kills + ' / ' + game.deaths + ' / ' + game.assists}"></td>

                            <td th:text="${game.totalMinionsKilled}"></td>

                            <td th:text="${game.visionScore}"></td>

                            <td th:text="${#temporals.format(game.match.gameCreation, 'dd.MM.yyyy')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div> </body>
</html>
