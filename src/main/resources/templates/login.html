<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LoL Analytics - Přihlášení</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #f8f9fa; }
        .auth-card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card p-4 shadow">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">LoL Analytics</h2>
                    <p class="text-secondary">Přihlaste se ke svému účtu</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
                    Nesprávné jméno nebo heslo.
                </div>

                <div th:if="${param.logout}" class="alert alert-success text-center py-2" role="alert">
                    Byli jste úspěšně odhlášeni.
                </div>

                <div th:if="${param.success}" class="alert alert-success text-center py-2" role="alert">
                    Registrace úspěšná! Nyní se přihlaste.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small text-secondary">Uživatelské jméno</label>
                        <input type="text" id="username" name="username" class="form-control bg-dark text-white border-secondary" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small text-secondary">Heslo</label>
                        <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Přihlásit se</button>
                </form>

                <div class="text-center small">
                    <span class="text-secondary">Nemáte ještě účet? </span>
                    <a th:href="@{/register}" class="text-primary text-decoration-none fw-bold">Registrovat se</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
