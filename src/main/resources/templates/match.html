<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LoL Analytics - Detail zápasu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #f8f9fa; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; }
        .table-blue { --bs-table-bg: #1a2836; }
        .table-red { --bs-table-bg: #2d1a1a; }
        .team-header-blue { color: #3b82f6; font-weight: bold; }
        .team-header-red { color: #ef4444; font-weight: bold; }
        .table th,
        .table td,
        .table td a {
            color: #ffffff !important;
        }
        /* Jemné podtržení jména hráče, když na něj najedeš myší */
        .table td a:hover {
            text-decoration: underline !important;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">✨ LoL Analyzer</a>
        <div class="ms-auto d-flex align-items-center">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm fw-bold">Odhlásit se</button>
            </form>
        </div>
    </div>
</nav>
<div class="container mt-5 mb-5">

    <button onclick="history.back()" class="btn btn-outline-secondary mb-4">← Zpět na profil</button>

    <div class="card p-4 mb-4 shadow">
        <div class="row align-items-center text-center text-md-start">
            <div class="col-md-6">
                <h2 class="text-primary fw-bold mb-1" th:text="${match.gameMode}">Herní mód</h2>
                <p class="text-secondary mb-0">
                    Datum: <span class="text-white fw-semibold" th:text="${#temporals.format(match.gameCreation, 'dd.MM.yyyy HH:mm')}"></span>
                </p>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <h4 class="mb-0 text-secondary">
                    Doba trvání: <span class="text-white fw-bold" th:text="${match.gameDuration / 60} + 'm ' + ${match.gameDuration % 60} + 's'">0m 0s</span>
                </h4>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4 shadow border-0">
        <h4 class="team-header-blue mb-3">🟦 Modrý tým <span class="text-secondary small" th:text="${participants[0].teamId == 100 and participants[0].win} ? '(Vítěz)' : ''"></span></h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle table-blue m-0">
                <thead>
                <tr>
                    <th style="width: 25%;">Hráč</th>
                    <th>KDA</th>
                    <th>Poškození (Damage)</th>
                    <th>CS (Minioni)</th>
                    <th>Vision Score</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${participants}" th:if="${p.teamId == 100 or p.teamId == 1}">
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/' + ${p.champion.name} + '.png'"
                                 width="36" height="36" class="rounded-circle me-2 border border-secondary"
                                 onerror="this.src='https://via.placeholder.com/36?text=?'">
                            <a th:href="@{/search(name=${p.summoner.name}, tag='EUNE')}"
                               class="text-white fw-bold text-decoration-none" th:text="${p.summoner.name}">Hráč</a>
                        </div>
                    </td>
                    <td class="fw-semibold" th:text="${p.kills + ' / ' + p.deaths + ' / ' + p.assists}">0 / 0 / 0</td>
                    <td th:text="${#numbers.formatInteger(p.totalDamage, 0, 'DEFAULT')}">0</td>
                    <td th:text="${p.totalMinionsKilled}">0</td>
                    <td th:text="${p.visionScore}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card p-3 shadow border-0">
        <h4 class="team-header-red mb-3">🟥 Červený tým <span class="text-secondary small" th:text="${participants[5].teamId == 200 and participants[5].win} ? '(Vítěz)' : ''"></span></h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle table-red m-0">
                <thead>
                <tr>
                    <th style="width: 25%;">Hráč</th>
                    <th>KDA</th>
                    <th>Poškození (Damage)</th>
                    <th>CS (Minioni)</th>
                    <th>Vision Score</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${participants}" th:if="${p.teamId == 200 or p.teamId == 2}">
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/champion/' + ${p.champion.name} + '.png'"
                                 width="36" height="36" class="rounded-circle me-2 border border-secondary"
                                 onerror="this.src='https://via.placeholder.com/36?text=?'">
                            <a th:href="@{/search(name=${p.summoner.name}, tag='EUNE')}"
                               class="text-white fw-bold text-decoration-none" th:text="${p.summoner.name}">Hráč</a>
                        </div>
                    </td>
                    <td class="fw-semibold" th:text="${p.kills + ' / ' + p.deaths + ' / ' + p.assists}">0 / 0 / 0</td>
                    <td th:text="${#numbers.formatInteger(p.totalDamage, 0, 'DEFAULT')}">0</td>
                    <td th:text="${p.totalMinionsKilled}">0</td>
                    <td th:text="${p.visionScore}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
